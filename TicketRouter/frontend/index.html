<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT 智能报修台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           DESIGN TOKENS — Industrial Tool Aesthetic
           ============================================================ */
        :root {
            /* --- color: OKLCH, warm gray base + amber accent --- */
            --color-bg:           oklch(0.975 0.003 85);
            --color-surface:      oklch(0.992 0.002 85);
            --color-surface-alt:  oklch(0.968 0.004 85);
            --color-text:         oklch(0.17 0.006 85);
            --color-text-muted:   oklch(0.42 0.012 85);
            --color-accent:       oklch(0.60 0.165 58);
            --color-accent-hover: oklch(0.52 0.170 50);
            --color-accent-soft:  oklch(0.94 0.035 68);
            --color-border:       oklch(0.87 0.006 85);
            --color-border-light: oklch(0.91 0.004 85);

            /* category colors */
            --color-network:    oklch(0.52 0.14 252);
            --color-hardware:   oklch(0.55 0.15 35);
            --color-software:   oklch(0.50 0.14 305);
            --color-account:    oklch(0.53 0.13 158);
            --color-electrical: oklch(0.53 0.15 78);
            --color-plumbing:   oklch(0.50 0.13 200);
            --color-furniture:  oklch(0.45 0.09 65);
            --color-hvac:       oklch(0.52 0.14 230);
            --color-other:      oklch(0.40 0.02 90);

            /* status colors */
            --color-pending:   oklch(0.64 0.16 55);
            --color-progress:  oklch(0.58 0.13 245);
            --color-done:      oklch(0.53 0.14 150);

            /* --- typography --- */
            --font-body:  "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans SC", system-ui, -apple-system, sans-serif;
            --font-mono:  "DM Mono", "SF Mono", "Cascadia Code", "Consolas", monospace;

            /* --- spacing (4px grid) --- */
            --space-1:  4px;
            --space-2:  8px;
            --space-3:  12px;
            --space-4:  16px;
            --space-5:  20px;
            --space-6:  24px;
            --space-8:  32px;
            --space-10: 40px;
            --space-12: 48px;

            /* --- radius --- */
            --radius-sm: 2px;
            --radius-md: 4px;
            --radius-lg: 8px;

            /* --- shadow --- */
            --shadow-sm: 0 1px 3px oklch(0 0 0 / 0.06);
            --shadow-md: 0 2px 8px oklch(0 0 0 / 0.08);

            /* --- transition --- */
            --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --ease-out-quart: cubic-bezier(0.17, 0.84, 0.44, 1);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            color: var(--color-text);
            background: var(--color-bg);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-image:
                url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        .notes { white-space: pre-wrap; }

        /* --- headings --- */
        .h1 { font-size: 1.75rem; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
        .h2 { font-size: 1.25rem; font-weight: 600; line-height: 1.3; }
        .h3 { font-size: 1rem; font-weight: 600; line-height: 1.35; }
        .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

        /* --- layout container --- */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: var(--space-8) var(--space-4);
        }

        /* ============================================================
           LOGIN SCREEN
           ============================================================ */
        .login-wrap {
            display: flex; align-items: center; justify-content: center;
            min-height: 90vh; padding: var(--space-8);
        }
        .login-card {
            width: 100%; max-width: 480px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-12) var(--space-10);
            text-align: center;
        }
        .login-card .brand {
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--color-accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: var(--space-6);
        }
        .login-card .h1 { margin-bottom: var(--space-3); }
        .login-card .subtitle {
            color: var(--color-text-muted);
            font-size: 0.9375rem;
            line-height: 1.6;
            margin-bottom: var(--space-8);
        }
        .login-actions { display: grid; gap: var(--space-3); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
            font-family: var(--font-body); font-size: 0.9375rem; font-weight: 500;
            padding: var(--space-3) var(--space-6);
            border: 1.5px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s var(--ease-out-quart);
            line-height: 1.4;
        }
        .btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

        .btn-primary {
            background: var(--color-accent);
            color: oklch(1 0 0);
            border-color: var(--color-accent);
        }
        .btn-primary:hover, .btn-primary:active {
            background: var(--color-accent-hover);
            border-color: var(--color-accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-outline {
            background: transparent;
            color: var(--color-accent);
            border-color: var(--color-accent);
        }
        .btn-outline:hover {
            background: var(--color-accent-soft);
        }

        .btn-ghost {
            background: transparent;
            color: var(--color-text-muted);
            border-color: transparent;
            font-size: 0.875rem;
            padding: var(--space-2) var(--space-3);
        }
        .btn-ghost:hover { color: var(--color-accent); }

        .btn-sm {
            font-size: 0.8125rem;
            padding: var(--space-1) var(--space-3);
        }
        .btn-xs {
            font-size: 0.75rem;
            padding: 2px var(--space-2);
            border-radius: var(--radius-sm);
        }

        .btn:disabled {
            opacity: 0.6; cursor: not-allowed; pointer-events: none;
        }

        /* ============================================================
           APP HEADER
           ============================================================ */
        .app-header {
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: var(--space-4); margin-bottom: var(--space-8);
            animation: fadeIn 0.4s var(--ease-out-quart);
        }
        .app-header .brand-mono {
            font-family: var(--font-mono);
            font-size: 0.6875rem;
            color: var(--color-accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .app-header .h1 { margin-bottom: var(--space-1); }
        .app-header .role-tag {
            display: inline-flex; align-items: center; gap: var(--space-1);
            font-size: 0.8125rem; color: var(--color-text-muted);
        }
        .app-header .role-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--color-accent);
        }
        .app-header .sep {
            display: inline-block; width: 1px; height: 14px;
            background: var(--color-border); margin: 0 var(--space-2); vertical-align: middle;
        }

        /* ============================================================
           STATS BAR (admin) — asymmetric, not identical cards
           ============================================================ */
        .stats-bar {
            display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-6);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-4) var(--space-6);
            margin-bottom: var(--space-6);
            animation: fadeIn 0.5s var(--ease-out-quart);
        }
        .stats-bar .stat-total {
            font-family: var(--font-mono);
            font-size: 2.5rem;
            font-weight: 500;
            color: var(--color-accent);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .stats-bar .stat-label { font-size: 0.75rem; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
        .stats-bar .stat-divider { width: 1px; height: 36px; background: var(--color-border-light); }
        .stats-bar .stat-group { display: flex; flex-direction: column; gap: var(--space-2); }
        .stats-bar .stat-group-label { font-size: 0.6875rem; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
        .stats-bar .stat-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); }

        .chip {
            display: inline-flex; align-items: center; gap: var(--space-1);
            font-size: 0.75rem; font-weight: 500;
            padding: 2px var(--space-2); border-radius: var(--radius-sm);
            font-family: var(--font-mono); font-variant-numeric: tabular-nums;
        }
        .chip-pending  { background: oklch(0.94 0.04 60); color: oklch(0.45 0.16 55); }
        .chip-progress { background: oklch(0.94 0.04 240); color: oklch(0.42 0.13 242); }
        .chip-done     { background: oklch(0.94 0.04 150); color: oklch(0.40 0.14 148); }
        .chip-network  { background: oklch(0.94 0.03 252); color: oklch(0.40 0.14 250); }
        .chip-hardware { background: oklch(0.94 0.03 40);  color: oklch(0.42 0.15 35); }
        .chip-software { background: oklch(0.94 0.03 305); color: oklch(0.38 0.14 303); }
        .chip-account    { background: oklch(0.94 0.03 158); color: oklch(0.40 0.13 155); }
        .chip-electrical { background: oklch(0.94 0.04 80);  color: oklch(0.42 0.15 78); }
        .chip-plumbing   { background: oklch(0.94 0.03 195); color: oklch(0.38 0.13 200); }
        .chip-furniture  { background: oklch(0.94 0.02 70);  color: oklch(0.38 0.09 65); }
        .chip-hvac       { background: oklch(0.94 0.03 225); color: oklch(0.40 0.14 230); }
        .chip-other      { background: oklch(0.94 0.01 95);  color: oklch(0.38 0.02 90); }

        /* --- stats bar responsive --- */
        @media (max-width: 600px) {
            .stats-bar { flex-direction: column; align-items: flex-start; gap: var(--space-3); padding: var(--space-4); }
            .stats-bar .stat-divider { width: 100%; height: 1px; }
        }

        /* ============================================================
           ADMIN TOOLBAR (filter)
           ============================================================ */
        .toolbar {
            display: flex; align-items: center; gap: var(--space-3);
            margin-bottom: var(--space-6);
            font-size: 0.875rem;
            animation: fadeIn 0.55s var(--ease-out-quart);
        }
        .toolbar label { color: var(--color-text-muted); font-size: 0.8125rem; }
        .select-sm {
            font-family: var(--font-body); font-size: 0.875rem;
            padding: var(--space-1) var(--space-3);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-surface);
            color: var(--color-text);
            cursor: pointer;
            outline: none;
            transition: border-color 0.15s var(--ease-out);
        }
        .select-sm:focus-visible { border-color: var(--color-accent); outline: none; }

        /* ============================================================
           TICKET FORM
           ============================================================ */
        .ticket-form {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-5) var(--space-6);
            margin-bottom: var(--space-6);
            animation: fadeIn 0.6s var(--ease-out-quart);
        }
        .ticket-form .form-label {
            font-size: 0.875rem; font-weight: 600; margin-bottom: var(--space-2); display: block;
        }
        .ticket-form textarea {
            width: 100%; min-height: 100px;
            font-family: var(--font-body); font-size: 0.9375rem; line-height: 1.6;
            padding: var(--space-3) var(--space-4);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg);
            color: var(--color-text);
            resize: vertical;
            transition: border-color 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out);
        }
        .ticket-form textarea:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px oklch(0.60 0.165 58 / 0.15);
        }
        .ticket-form .form-footer {
            display: flex; align-items: center; justify-content: space-between;
            gap: var(--space-3); margin-top: var(--space-3);
        }
        .ticket-form .form-hint { font-size: 0.8125rem; color: var(--color-text-muted); }
        .ticket-form .form-hint.success { color: oklch(0.45 0.14 150); }
        .ticket-form .form-hint.error   { color: oklch(0.48 0.16 30); }

        /* loading dots */
        .loading-dots { display: inline-flex; gap: 3px; }
        .loading-dots span {
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--color-accent);
            animation: dotPulse 1.2s infinite var(--ease-out-quart);
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        /* ============================================================
           TICKET LOBBY
           ============================================================ */
        .lobby-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: var(--space-4);
            animation: fadeIn 0.65s var(--ease-out-quart);
        }
        .ticket-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-4);
        }
        @media (max-width: 640px) {
            .ticket-grid { grid-template-columns: 1fr; }
        }

        /* ============================================================
           TICKET CARD — NO side-stripe borders!
           ============================================================ */
        .ticket-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: box-shadow 0.2s var(--ease-out);
            animation: cardIn 0.4s var(--ease-out-quart) both;
        }
        .ticket-card:hover { box-shadow: var(--shadow-md); }

        .ticket-card .card-topbar {
            height: 3px; width: 100%;
        }
        .ticket-card .card-topbar.pending  { background: var(--color-pending); }
        .ticket-card .card-topbar.progress { background: var(--color-progress); }
        .ticket-card .card-topbar.done     { background: var(--color-done); }

        .ticket-card .card-body {
            padding: var(--space-5) var(--space-4) var(--space-4);
        }
        .ticket-card .card-header {
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: var(--space-2); margin-bottom: var(--space-3);
        }
        .ticket-card .card-category {
            display: flex; align-items: center; gap: var(--space-2);
            font-weight: 600; font-size: 0.9375rem;
        }
        .ticket-card .cat-dot {
            width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
        }
        .ticket-card .cat-dot.network  { background: var(--color-network); }
        .ticket-card .cat-dot.hardware { background: var(--color-hardware); }
        .ticket-card .cat-dot.software { background: var(--color-software); }
        .ticket-card .cat-dot.account    { background: var(--color-account); }
        .ticket-card .cat-dot.electrical { background: var(--color-electrical); }
        .ticket-card .cat-dot.plumbing   { background: var(--color-plumbing); }
        .ticket-card .cat-dot.furniture  { background: var(--color-furniture); }
        .ticket-card .cat-dot.hvac       { background: var(--color-hvac); }
        .ticket-card .cat-dot.other      { background: var(--color-other); }

        .ticket-card .card-time {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--color-text-muted);
            white-space: nowrap;
        }
        .ticket-card .card-desc {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            line-height: 1.55;
            margin-bottom: var(--space-3);
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .ticket-card .card-desc.expanded {
            -webkit-line-clamp: unset;
            display: block;
        }
        .ticket-card .card-desc-toggle {
            font-size: 0.75rem; color: var(--color-accent); cursor: pointer;
            background: none; border: none; padding: 0; font-family: var(--font-body);
            margin-bottom: var(--space-2); display: inline-block;
        }
        .ticket-card .card-actions {
            display: flex; flex-wrap: wrap; gap: var(--space-2);
            padding-top: var(--space-3);
            border-top: 1px solid var(--color-border-light);
        }

        /* status badge inline */
        .status-badge {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 0.75rem; font-weight: 500;
        }
        .status-badge .sb-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .status-badge.pending  .sb-dot { background: var(--color-pending); }
        .status-badge.progress .sb-dot { background: var(--color-progress); }
        .status-badge.done     .sb-dot { background: var(--color-done); }
        .status-badge.pending  { color: oklch(0.45 0.16 55); }
        .status-badge.progress { color: oklch(0.42 0.13 245); }
        .status-badge.done     { color: oklch(0.40 0.14 150); }

        /* suggestion */
        .ticket-card .card-suggestion {
            margin-top: var(--space-3);
            padding: var(--space-3);
            background: var(--color-surface-alt);
            border-left: 3px solid var(--color-accent);
            border-radius: var(--radius-sm);
            font-size: 0.8125rem;
            color: var(--color-text-muted);
            line-height: 1.65;
            display: none;
        }
        .ticket-card .card-suggestion.visible {
            display: block;
            animation: fadeIn 0.3s var(--ease-out-quart);
        }
        .ticket-card .card-suggestion-label {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--color-accent);
            margin-bottom: var(--space-2);
            font-family: var(--font-mono);
        }
        .ticket-card .card-suggestion-content {
            white-space: pre-wrap;
        }

        /* card highlight flash */
        .ticket-card.flash {
            animation: cardFlash 0.8s var(--ease-out-quart);
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: var(--space-12) var(--space-8);
            border: 1px dashed var(--color-border);
            border-radius: var(--radius-lg);
            color: var(--color-text-muted);
            font-size: 0.9375rem;
            animation: fadeIn 0.5s var(--ease-out-quart);
        }
        .empty-state .empty-icon {
            font-family: var(--font-mono);
            font-size: 2rem;
            margin-bottom: var(--space-3);
            color: var(--color-border);
        }

        /* ============================================================
           KEYFRAMES
           ============================================================ */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes cardFlash {
            0%   { background: var(--color-accent-soft); }
            100% { background: var(--color-surface); }
        }
        @keyframes dotPulse {
            0%, 100% { transform: scale(0.6); opacity: 0.4; }
            50%      { transform: scale(1);   opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="loginWrap" class="login-wrap">
        <div class="login-card">
            <div class="brand">TicketRouter</div>
            <h1 class="h1">IT 智能报修台</h1>
            <p class="subtitle">请选择身份进入系统。管理员可管理工单状态，普通用户可提交故障描述并查看大厅。</p>
            <div class="login-actions">
                <button id="loginUserBtn" class="btn btn-outline">普通用户登录</button>
                <button id="loginAdminBtn" class="btn btn-primary">管理员登录</button>
            </div>
        </div>
    </div>

    <div id="appWrap" style="display:none;">
        <div class="container">

            <div class="app-header">
                <div>
                    <div class="brand-mono">TicketRouter</div>
                    <h1 class="h1">IT 智能报修台</h1>
                    <span class="role-tag">
                        <span class="role-dot"></span>
                        <span id="roleHint">加载中...</span>
                    </span>
                </div>
                <button id="logoutBtn" class="btn btn-ghost">退出</button>
            </div>

            <div id="adminPanel" style="display:none;">
                <div class="stats-bar" id="statsBar">
                    <div>
                        <div class="stat-label">总工单</div>
                        <div class="stat-total" id="totalCount">0</div>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-group">
                        <div class="stat-group-label">状态分布</div>
                        <div class="stat-chips" id="statusChips"></div>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-group">
                        <div class="stat-group-label">分类分布</div>
                        <div class="stat-chips" id="categoryChips"></div>
                    </div>
                </div>

                <div class="toolbar">
                    <label for="statusFilter">筛选</label>
                    <select id="statusFilter" class="select-sm">
                        <option value="all">全部状态</option>
                        <option value="待处理">待处理</option>
                        <option value="处理中">处理中</option>
                        <option value="已完成">已完成</option>
                    </select>
                </div>
            </div>

            <div class="ticket-form">
                <label class="form-label" for="description">故障描述</label>
                <textarea id="description" rows="4" placeholder="请详细描述您遇到的设备问题，例如：我的电脑屏幕突然变蓝了，怎么按都没反应"></textarea>
                <div class="form-footer">
                    <span id="statusText" class="form-hint">AI 自动分拣将让工单更标准、更高效。</span>
                    <button id="submitBtn" class="btn btn-primary">提交并智能分拣</button>
                </div>
            </div>

            <div class="lobby-header">
                <h2 class="h2">工单大厅</h2>
            </div>
            <div class="ticket-grid" id="tickets"></div>
            <div id="emptyState" class="empty-state" style="display:none;">
                <div class="empty-icon">&#x25A2;</div>
                还没有工单。请提交您的第一条故障描述。
            </div>
        </div>
    </div>

    <script>
        const ROLES  = { USER: '普通用户', ADMIN: '管理员' };
        const STATUSES = ['待处理', '处理中', '已完成'];

        const CATEGORY_CSS = {
            '网络问题': 'network',
            '硬件故障': 'hardware',
            '软件异常': 'software',
            '账号权限': 'account',
            '电力照明': 'electrical',
            '管道漏水': 'plumbing',
            '门窗家具': 'furniture',
            '空调暖通': 'hvac',
            '其他问题': 'other'
        };
        const STATUS_CSS = {
            '待处理': 'pending',
            '处理中': 'progress',
            '已完成': 'done'
        };
        const CHIP_CSS = {
            '待处理': 'chip-pending',
            '处理中': 'chip-progress',
            '已完成': 'chip-done',
            '网络问题': 'chip-network',
            '硬件故障': 'chip-hardware',
            '软件异常': 'chip-software',
            '账号权限': 'chip-account',
            '电力照明': 'chip-electrical',
            '管道漏水': 'chip-plumbing',
            '门窗家具': 'chip-furniture',
            '空调暖通': 'chip-hvac',
            '其他问题': 'chip-other'
        };

        /* ------- session ------- */
        function getRole()  { return localStorage.getItem('ticket_role'); }
        function setRole(r) { localStorage.setItem('ticket_role', r); }
        function clearRole() { localStorage.removeItem('ticket_role'); }

        function showLogin() {
            document.getElementById('loginWrap').style.display = 'flex';
            document.getElementById('appWrap').style.display = 'none';
        }
        function showApp() {
            document.getElementById('loginWrap').style.display = 'none';
            document.getElementById('appWrap').style.display = 'block';
            var role = getRole();
            document.getElementById('roleHint').textContent = '当前身份：' + role;
            document.getElementById('adminPanel').style.display = role === ROLES.ADMIN ? 'block' : 'none';
            fetchTickets();
            if (role === ROLES.ADMIN) fetchStats();
        }
        function login(role)  { setRole(role); showApp(); }
        function logout()     { clearRole(); showLogin(); }

        /* ------- API ------- */
        async function fetchTickets() {
            var grid = document.getElementById('tickets');
            var empty = document.getElementById('emptyState');
            var role = getRole();
            var filter = (document.getElementById('statusFilter') && document.getElementById('statusFilter').value) || 'all';
            grid.innerHTML = '';

            try {
                var res = await fetch('/api/tickets');
                var tickets = await res.json();
                var filtered = filter === 'all' ? tickets : tickets.filter(function(t) { return t.status === filter; });

                if (!filtered.length) {
                    empty.style.display = 'block';
                    return;
                }
                empty.style.display = 'none';

                filtered.forEach(function(ticket, i) {
                    var card = document.createElement('div');
                    card.className = 'ticket-card';
                    card.style.animationDelay = (i * 0.05) + 's';

                    var statusCss = STATUS_CSS[ticket.status] || 'pending';
                    var catCss = CATEGORY_CSS[ticket.category] || 'network';

                    var topBar = '<div class="card-topbar ' + statusCss + '"></div>';

                    var categoryLine =
                        '<div class="card-category">' +
                            '<span class="cat-dot ' + catCss + '"></span>' +
                            escapeHtml(ticket.category) +
                        '</div>';

                    var statusBadge =
                        '<span class="status-badge ' + statusCss + '">' +
                            '<span class="sb-dot"></span>' +
                            escapeHtml(ticket.status) +
                        '</span>';

                    var headerHtml =
                        '<div class="card-header">' +
                            categoryLine +
                            statusBadge +
                        '</div>';

                    var timeHtml = '<div class="card-time">' + escapeHtml(ticket.created_at) + '</div>';

                    var descText = escapeHtml(ticket.description);
                    var descHtml = '';
                    if (descText.length > 140) {
                        descHtml =
                            '<p class="card-desc">' + descText + '</p>' +
                            '<button class="card-desc-toggle" onclick="toggleDesc(this)">展开全文</button>';
                    } else {
                        descHtml = '<p class="card-desc expanded">' + descText + '</p>';
                    }

                    var actionsHtml = '';
                    if (role === ROLES.ADMIN) {
                        var suggestBtn = '<button class="btn btn-outline btn-xs" onclick="fetchSuggestion(' + ticket.id + ', this)">AI 处理建议</button>';
                        var buttons = STATUSES.filter(function(s) { return s !== ticket.status; }).map(function(status) {
                            return '<button class="btn btn-outline btn-xs" onclick="updateStatus(' + ticket.id + ",'" + status + "')\">设为" + status + '</button>';
                        });
                        actionsHtml = '<div class="card-actions">' + suggestBtn + buttons.join('') + '</div>';
                    }

                    var suggestionHtml = '<div class="card-suggestion" id="sugg-' + ticket.id + '"><div class="card-suggestion-label">AI 处理建议</div><div class="card-suggestion-content"></div></div>';

                    card.innerHTML =
                        topBar +
                        '<div class="card-body">' +
                            headerHtml +
                            timeHtml +
                            descHtml +
                            suggestionHtml +
                            actionsHtml +
                        '</div>';

                    grid.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                var hint = document.getElementById('statusText');
                if (hint) {
                    hint.textContent = '无法加载工单：请确保后端已启动 (uvicorn backend.main:app --reload)，访问 http://127.0.0.1:8000/';
                    hint.className = 'form-hint error';
                }
            }
        }

        function toggleDesc(btn) {
            var desc = btn.previousElementSibling;
            var expanded = desc.classList.toggle('expanded');
            btn.textContent = expanded ? '收起' : '展开全文';
        }

        async function fetchStats() {
            try {
                var res = await fetch('/api/tickets/stats');
                var stats = await res.json();
                document.getElementById('totalCount').textContent = stats.total;

                var statusHtml = '';
                for (var key in stats.by_status) {
                    var css = CHIP_CSS[key] || 'chip-pending';
                    statusHtml += '<span class="chip ' + css + '">' + escapeHtml(key) + '&nbsp;' + stats.by_status[key] + '</span>';
                }
                document.getElementById('statusChips').innerHTML = statusHtml || '<span class="chip">&mdash;</span>';

                var catHtml = '';
                for (var catKey in stats.by_category) {
                    var catCss = CHIP_CSS[catKey] || 'chip-network';
                    catHtml += '<span class="chip ' + catCss + '">' + escapeHtml(catKey) + '&nbsp;' + stats.by_category[catKey] + '</span>';
                }
                document.getElementById('categoryChips').innerHTML = catHtml || '<span class="chip">&mdash;</span>';
            } catch (e) { console.error(e); }
        }

        async function submitTicket() {
            var descInput = document.getElementById('description');
            var desc = descInput.value.trim();
            var statusText = document.getElementById('statusText');
            var submitBtn = document.getElementById('submitBtn');

            if (!desc) {
                statusText.textContent = '请填写故障描述后再提交。';
                statusText.className = 'form-hint error';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span> 分拣中';
            statusText.textContent = '正在提交并智能分类，请稍候...';
            statusText.className = 'form-hint';

            try {
                var res = await fetch('/api/tickets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description: desc }),
                });
                if (!res.ok) {
                    var err = await res.json();
                    throw new Error(err.detail || '提交失败');
                }
                descInput.value = '';
                statusText.textContent = '提交成功。已为您的工单生成 AI 分类标签。';
                statusText.className = 'form-hint success';
                await fetchTickets();
                if (getRole() === ROLES.ADMIN) await fetchStats();
            } catch (e) {
                console.error(e);
                var msg = e.message || '';
                if (msg.indexOf('Failed to fetch') !== -1 || msg.indexOf('refused') !== -1) {
                    statusText.textContent = '提交失败：后端服务未连接，请启动 uvicorn backend.main:app --reload 后再刷新页面。';
                } else {
                    statusText.textContent = msg || '提交失败，请稍后重试。';
                }
                statusText.className = 'form-hint error';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '提交并智能分拣';
            }
        }

        async function updateStatus(ticketId, status) {
            var statusText = document.getElementById('statusText');
            statusText.textContent = '正在更新工单 ' + ticketId + ' 状态为 ' + status + '...';
            statusText.className = 'form-hint';
            try {
                var res = await fetch('/api/tickets/' + ticketId + '/status', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: status }),
                });
                if (!res.ok) {
                    var err = await res.json();
                    throw new Error(err.detail || '更新失败');
                }
                statusText.textContent = '工单 ' + ticketId + ' 状态已更新为 ' + status + '。';
                statusText.className = 'form-hint success';
                await fetchTickets();
                await fetchStats();

                /* flash the updated card */
                setTimeout(function() {
                    var cards = document.querySelectorAll('.ticket-card');
                    cards.forEach(function(c) {
                        if (c.textContent.indexOf('' + ticketId) !== -1) {
                            c.classList.add('flash');
                            setTimeout(function() { c.classList.remove('flash'); }, 800);
                        }
                    });
                }, 100);
            } catch (e) {
                console.error(e);
                statusText.textContent = e.message || '状态更新失败，请稍后重试。';
                statusText.className = 'form-hint error';
            }
        }

        async function fetchSuggestion(ticketId, btn) {
            var statusText = document.getElementById('statusText');
            var suggestionEl = document.getElementById('sugg-' + ticketId);
            var contentEl = suggestionEl ? suggestionEl.querySelector('.card-suggestion-content') : null;

            if (!suggestionEl || !contentEl) {
                statusText.textContent = '页面元素缺失，请刷新后重试。';
                statusText.className = 'form-hint error';
                return;
            }

            if (suggestionEl.classList.contains('visible')) {
                suggestionEl.classList.remove('visible');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span> 生成中';
            statusText.textContent = '正在生成 AI 处理建议...';
            statusText.className = 'form-hint';

            try {
                var res = await fetch('/api/tickets/' + ticketId + '/suggestion');
                if (!res.ok) {
                    var err = await res.json();
                    throw new Error(err.detail || '获取建议失败');
                }
                var data = await res.json();
                contentEl.textContent = data.suggestion;
                suggestionEl.classList.add('visible');
                statusText.textContent = 'AI 处理建议已生成。';
                statusText.className = 'form-hint success';
            } catch (e) {
                console.error(e);
                statusText.textContent = e.message || '获取 AI 建议失败，请稍后重试。';
                statusText.className = 'form-hint error';
            } finally {
                btn.disabled = false;
                btn.textContent = 'AI 处理建议';
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        /* ------- event binding ------- */
        document.getElementById('loginUserBtn').addEventListener('click', function() { login(ROLES.USER); });
        document.getElementById('loginAdminBtn').addEventListener('click', function() { login(ROLES.ADMIN); });
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('submitBtn').addEventListener('click', submitTicket);
        var filterEl = document.getElementById('statusFilter');
        if (filterEl) filterEl.addEventListener('change', fetchTickets);

        window.addEventListener('load', function() {
            getRole() ? showApp() : showLogin();
        });
    </script>
</body>
</html>
