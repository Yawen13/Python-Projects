<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyRead - AI阅读助理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #ddf7f3; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .card-note { border-left: 5px solid #575d68; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container my-5" style="max-width: 800px;">
    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold" style="color: #000000;">EasyRead</h1>
        <p class="text-muted">阅读与笔记管理系统</p>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3">输入要解析的长难句/段落</h5>
            <div class="mb-3">
                <textarea id="textInput" class="form-control" rows="4" placeholder="请在这里粘贴你读不懂的英文长难句或晦涩文献段落..."></textarea>
            </div>
            <button id="submitBtn" class="btn btn-success w-100 py-2 fw-bold" onclick="submitNote()">
                提交并让 AI 进行解析
            </button>
        </div>
    </div>

    <div class="input-group mb-4">
        <input id="searchInput" type="text" class="form-control" placeholder="搜索原文或 AI 解析内容..." oninput="loadNotes(this.value)">
        <button class="btn btn-outline-secondary" type="button" onclick="clearSearch()">清除</button>
    </div>

    <h5 class="mb-3 text-secondary">我的阅记历史</h5>
    <div id="notesContainer">
        <div class="text-center text-muted py-3">加载历史记录中...</div>
    </div>
</div>

<script>
    // 页面一打开，就立刻去后端拿以前的所有笔记
    window.onload = function() {
        loadNotes();
    };

    // 核心功能一：从后端拉取列表并显示
    async function loadNotes(query = '') {
        try {
            const url = query ? `http://127.0.0.1:8000/api/notes?query=${encodeURIComponent(query)}` : 'http://127.0.0.1:8000/api/notes';
            const response = await fetch(url);
            const notes = await response.json();
            
            const container = document.getElementById('notesContainer');
            document.getElementById('searchInput').value = query || '';
            container.innerHTML = ''; // 清空提示文字
            
            if (notes.length === 0) {
                container.innerHTML = '<div class="text-center text-muted py-3">目前还没有记录，快去提交第一条吧！</div>';
                return;
            }

            // 循环遍历每一条数据，拼成 HTML 卡片
            notes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'card card-note shadow-sm animate__animated animate__fadeIn';
                card.innerHTML = `
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <p class="card-text text-muted small mb-1">记录于：${note.created_at}</p>
                                <p class="card-text fw-semibold mb-2" style="color: #343a40;">原文：</p>
                            </div>
                            <div>
                                <button class="btn btn-outline-primary btn-sm me-2" onclick="editNote(${note.id}, '${encodeURIComponent(note.original_text)}')">
                                    编辑
                                </button>
                                <button class="btn btn-outline-danger btn-sm" onclick="deleteNote(${note.id})">
                                    删除
                                </button>
                            </div>
                        </div>
                        <blockquote class="blockquote bg-light p-2 rounded fs-6 text-secondary" style="border-left: 3px solid #6c757d;">
                            ${note.original_text}
                        </blockquote>
                        <p class="card-text fw-bold text-success mb-1">AI解析:</p>
                        <p class="card-text text-dark fs-6 bg-success bg-opacity-10 p-2 rounded">${note.ai_summary}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (error) {
            console.error('加载失败:', error);
        }
    }

   
    async function submitNote() {
        const textInput = document.getElementById('textInput');
        const submitBtn = document.getElementById('submitBtn');
        const text = textInput.value.trim();

        if (!text) {
            alert('请先输入点内容吧！');
            return;
        }

        
        submitBtn.disabled = true;
        submitBtn.innerText = 'AI 正在思考并翻译中...';

        try {
            
            const response = await fetch('http://127.0.0.1:8000/api/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });

            if (response.ok) {
                textInput.value = ''; // 提交成功清空输入框
                await loadNotes();    // 重新刷新列表，让最新的一条显示在最上面
            } else {
                alert('服务器开小差了，请重试！');
            }
        } catch (error) {
            alert('网络连接失败，请确保后端正常运行！');
        } finally {
            // 恢复按钮状态
            submitBtn.disabled = false;
            submitBtn.innerText = '提交并让 AI 进行翻译解析';
        }
    }

    async function deleteNote(id) {
        if (!confirm('确认要删除这条记录吗？')) {
            return;
        }

        try {
            const response = await fetch(`http://127.0.0.1:8000/api/notes/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                await loadNotes();
            } else {
                alert('删除失败，请重试。');
            }
        } catch (error) {
            alert('网络连接失败，请确保后端正常运行！');
        }
    }

    function clearSearch() {
        const searchInput = document.getElementById('searchInput');
        searchInput.value = '';
        loadNotes();
    }

    async function editNote(id, encodedOriginalText) {
        const originalText = decodeURIComponent(encodedOriginalText);
        const newText = prompt('请编辑原文，然后重新翻译：', originalText);
        if (newText === null) {
            return;
        }

        const text = newText.trim();
        if (!text) {
            alert('内容不能为空。');
            return;
        }

        try {
            const response = await fetch(`http://127.0.0.1:8000/api/notes/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });

            if (response.ok) {
                await loadNotes(document.getElementById('searchInput').value.trim());
            } else {
                const data = await response.json();
                alert(data.detail || '编辑翻译失败，请重试。');
            }
        } catch (error) {
            alert('网络连接失败，请确保后端正常运行！');
        }
    }
</script>

</body>
</html>
